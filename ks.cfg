# TencentOS 3.1 自动安装 Kickstart 配置文件
# 用于 Pigsty 集群部署

# 安装模式
install

# 文本模式安装
text

# 键盘布局
keyboard --vckeymap=us --xlayouts='us'

# 语言
lang en_US.UTF-8

# 时区
timezone Asia/Shanghai --utc

# 网络配置 (DHCP，安装后可修改为静态IP)
network --bootproto=dhcp --device=link --activate

# root 密码 (请修改!)
rootpw --plaintext Pigsty@2024

# 创建普通用户 (可选)
user --name=admin --password=Pigsty@2024 --plaintext --gecos="Admin User" --groups=wheel

# 启用 SSH
services --enabled=sshd

# 防火墙配置
firewall --enabled --ssh

# SELinux 配置 (建议 permissive 以便后续配置)
selinux --permissive

# 引导加载程序
bootloader --location=mbr --boot-drive=sda

# 磁盘分区 (自动分区，使用 LVM)
autopart --type=lvm

# 清除所有分区
clearpart --all --initlabel --drives=sda

# 最小化安装
%packages --nobase
@core
openssh-server
openssh-clients
sudo
vim-minimal
curl
wget
tar
gzip
net-tools
bind-utils
bash-completion
%end

# 安装后脚本
%post --log=/root/ks-post.log
#!/bin/bash

# 设置主机名 (需要根据节点修改)
# hostnamectl set-hostname pigsty-node1

# 配置 sudo 免密
echo "%wheel ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers.d/wheel

# 配置 SSH 允许 root 登录
sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
sed -i 's/^PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
systemctl restart sshd

# 禁用防火墙 (Pigsty 部署时需要)
systemctl stop firewalld
systemctl disable firewalld

# 配置 DNS
echo "nameserver 8.8.8.8" > /etc/resolv.conf
echo "nameserver 114.114.114.114" >> /etc/resolv.conf

# 创建 Pigsty 准备脚本
cat > /root/pigsty_prepare.sh << 'EOF'
#!/bin/bash
# TencentOS 适配 Pigsty 准备脚本

# 修改 os-release 使其兼容 Pigsty
cp /etc/os-release /etc/os-release.bak

cat > /etc/os-release << 'OSRELEASE'
NAME="TencentOS Server"
VERSION="3.1 (Compatible with EL8 for Pigsty)"
ID="rocky"
ID_LIKE="rhel centos fedora tencentos"
VERSION_ID="8.6"
PLATFORM_ID="platform:el8"
PRETTY_NAME="TencentOS Server 3.1 (EL8 Compatible)"
ANSI_COLOR="0;31"
CPE_NAME="cpe:/o:rocky:rocky:8"
HOME_URL="https://tlinux.tencent.com/"
BUG_REPORT_URL="https://tlinux.tencent.com/"
ROCKY_SUPPORT_PRODUCT="Rocky Linux"
ROCKY_SUPPORT_PRODUCT_VERSION="8"
OSRELEASE

echo "TencentOS 已适配为 EL8 兼容模式"
echo "现在可以安装 Pigsty:"
echo "  curl -fsSL https://repo.pigsty.io/get | bash -s v4.0.0"
echo "  cd ~/pigsty"
echo "  ./bootstrap -p /tmp/pkg.tgz"
echo "  ./configure -g"
echo "  ./deploy.yml"
EOF

chmod +x /root/pigsty_prepare.sh

echo "Kickstart post-install completed at $(date)" >> /root/ks-post.log

%end

# 完成后重启
reboot
